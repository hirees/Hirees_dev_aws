# Example for the Hirees host. Page HTML, sitemap, robots, and the job
# feed must be served by this Node app so Google receives real HTML and
# real status codes. Do not send every unknown URL to the Vite index with 200.

server {
  listen 443 ssl;
  server_name www.hirees.com;

  location /assets/ {
    root /var/www/hirees/frontend/dist;
  }

  location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
